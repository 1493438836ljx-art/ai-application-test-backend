openapi: 3.0.0
info:
  title: 工作流编排系统 API
  version: 2.0.0
  description: |
    工作流编排系统的后端 API 接口定义。
    AI 助手通过这些接口管理工作流、配置节点参数、执行工作流。

    ## 节点类型体系

    系统采用「核心9种类型 + Skill动态加载」模式：

    | 分类 | 类型 | 说明 |
    |------|------|------|
    | BASIC | `start`, `end` | 基础节点 |
    | LOGIC | `condition_simple`, `condition_multi`, `loop`, `batch`, `async`, `collect` | 逻辑控制 |
    | EXECUTION | `skill` | 动态加载 Skill 执行 |

servers:
  - url: http://localhost:8080
    description: 后端服务地址

paths:
  # ==================== 工作流管理 ====================

  /api/workflow:
    post:
      summary: 创建工作流
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreateRequest'
      responses:
        '201':
          description: 创建成功

  /api/workflow/default:
    get:
      summary: 获取默认工作流
      description: 获取系统默认工作流的详细信息
      operationId: getDefaultWorkflow
      responses:
        '200':
          description: 工作流详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'

  /api/workflow/{id}:
    get:
      summary: 获取工作流详情
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 工作流详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'

  /api/workflow/list:
    get:
      summary: 获取工作流列表
      operationId: getWorkflowList
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: 工作流分页列表

  /api/workflow/status/{status}:
    get:
      summary: 按状态查询工作流
      operationId: getWorkflowListByStatus
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
      responses:
        '200':
          description: 工作流列表

  /api/workflow/search:
    get:
      summary: 搜索工作流
      operationId: searchWorkflows
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 搜索结果

  /api/workflow/{id}:
    put:
      summary: 更新工作流信息
      operationId: updateWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdateRequest'
      responses:
        '200':
          description: 更新成功

    delete:
      summary: 删除工作流
      operationId: deleteWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功

  /api/workflow/{id}/publish:
    post:
      summary: 发布工作流
      operationId: publishWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 发布成功

  /api/workflow/{id}/unpublish:
    post:
      summary: 取消发布工作流
      operationId: unpublishWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 取消发布成功

  /api/workflow/{id}/copy:
    post:
      summary: 复制工作流
      operationId: copyWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: 复制成功

  /api/workflow/{id}/data/json:
    post:
      summary: 保存工作流数据（JSON，全量覆盖）
      description: |
        ## 核心机制：全量覆盖

        请求体中的 `nodes`、`connections`、`associations` 代表工作流的**完整数据**。
        后端会先删除该工作流的所有旧数据，再插入新数据。

        ### 删除节点的实现方式
        - 从 `nodes` 数组中移除要删除的节点
        - 从 `connections` 数组中移除与该节点相关的连线
        - 从 `associations` 数组中移除相关关联
        - 调用此接口，传入剩余的完整数据

        ### 注意事项
        1. 每次保存都必须传入**完整的**工作流数据
        2. `inputPorts`、`outputPorts`、`inputParams`、`outputParams`、`config` 都是 JSON 字符串
        3. `nodeUuid` 和 `connectionUuid` 由前端生成
        4. `connections` 中引用的节点必须在 `nodes` 中存在
      operationId: saveWorkflowDataJson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDataRequest'
      responses:
        '200':
          description: 保存成功

  # ==================== 节点管理 ====================

  /api/workflows/{workflowId}/nodes:
    get:
      summary: 获取工作流所有节点
      operationId: getNodes
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 节点列表

    post:
      summary: 创建节点
      operationId: createNode
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateRequest'
      responses:
        '201':
          description: 创建成功

  /api/workflows/{workflowId}/nodes/batch:
    post:
      summary: 批量创建节点
      operationId: batchCreateNodes
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NodeCreateRequest'
      responses:
        '201':
          description: 批量创建成功

  /api/workflows/{workflowId}/nodes/{nodeUuid}:
    get:
      summary: 获取单个节点
      operationId: getNode
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 节点详情

    put:
      summary: 更新节点
      operationId: updateNode
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdateRequest'
      responses:
        '200':
          description: 更新成功

    delete:
      summary: 删除节点
      operationId: deleteNode
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /api/workflows/{workflowId}/nodes/by-skill/{skillId}:
    get:
      summary: 根据 Skill ID 查询关联节点
      operationId: getNodesBySkillId
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 节点列表

  # ==================== 连线管理 ====================

  /api/workflows/{workflowId}/connections:
    get:
      summary: 获取工作流所有连线
      operationId: getConnections
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 连线列表

    post:
      summary: 创建连线
      operationId: createConnection
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequest'
      responses:
        '201':
          description: 创建成功

  /api/workflows/{workflowId}/connections/{connectionUuid}:
    get:
      summary: 获取单条连线
      operationId: getConnection
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: connectionUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 连线详情

    delete:
      summary: 删除连线
      operationId: deleteConnection
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: connectionUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /api/workflows/{workflowId}/connections/source/{nodeUuid}:
    get:
      summary: 获取指定节点作为源的所有连线
      operationId: getConnectionsBySourceNode
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 连线列表

  /api/workflows/{workflowId}/connections/target/{nodeUuid}:
    get:
      summary: 获取指定节点作为目标的所有连线
      operationId: getConnectionsByTargetNode
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 连线列表

  # ==================== 验证 ====================

  /api/workflows/{workflowId}/validate:
    post:
      summary: 验证工作流结构
      description: |
        验证工作流结构是否合法，包括：
        - 必须有且仅有一个开始节点和一个结束节点
        - 不能有孤立节点
        - 不能有循环依赖
        - Skill 节点引用的 Skill 必须存在且兼容
      operationId: validateWorkflow
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 验证结果

  /api/workflows/{workflowId}/predecessors/{nodeUuid}:
    get:
      summary: 获取节点的前驱节点
      operationId: getPredecessors
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 前驱节点列表

  /api/workflows/{workflowId}/available-variables/{nodeUuid}:
    get:
      summary: 获取节点可用的变量列表
      description: 获取指定节点可以引用的所有上游变量
      operationId: getAvailableVariables
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 可用变量列表

  /api/workflows/{workflowId}/check-reference/{nodeUuid}:
    get:
      summary: 检查节点是否被其他节点引用
      operationId: checkReference
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nodeUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 引用检查结果

  /api/workflows/{workflowId}/execution-order:
    get:
      summary: 获取工作流执行顺序
      operationId: getExecutionOrder
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 节点执行顺序列表

  # ==================== 节点类型 ====================

  /api/workflow/node-types:
    get:
      summary: 获取所有启用的节点类型
      operationId: getAllNodeTypes
      responses:
        '200':
          description: 节点类型列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeTypeResponse'

    post:
      summary: 创建节点类型
      operationId: createNodeType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTypeCreateRequest'
      responses:
        '201':
          description: 创建成功

  /api/workflow/node-types/page:
    get:
      summary: 分页获取节点类型
      operationId: getNodeTypeList
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页结果

  /api/workflow/node-types/{id}:
    get:
      summary: 根据ID获取节点类型
      operationId: getNodeTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 节点类型详情

    put:
      summary: 更新节点类型
      operationId: updateNodeType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTypeUpdateRequest'
      responses:
        '200':
          description: 更新成功

    delete:
      summary: 删除节点类型
      operationId: deleteNodeType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功

  /api/workflow/node-types/code/{code}:
    get:
      summary: 根据编码获取节点类型
      operationId: getNodeTypeByCode
      parameters:
        - name: code
          in: path
          required: true
          description: |
            节点类型编码，支持的核心类型：
            - `start`: 开始节点
            - `end`: 结束节点
            - `condition_simple`: 简单条件分支
            - `condition_multi`: 多路条件分支
            - `loop`: 循环控制
            - `batch`: 批处理
            - `async`: 异步处理
            - `collect`: 结果收集
            - `skill`: 技能执行
          schema:
            type: string
      responses:
        '200':
          description: 节点类型详情

  /api/workflow/node-types/category/{category}:
    get:
      summary: 根据分类获取节点类型
      operationId: getNodeTypesByCategory
      parameters:
        - name: category
          in: path
          required: true
          description: |
            分类名称：
            - `BASIC`: 基础节点（start, end）
            - `LOGIC`: 逻辑控制（condition_simple, condition_multi, loop, batch, async, collect）
            - `EXECUTION`: 执行节点（skill）
          schema:
            type: string
      responses:
        '200':
          description: 节点类型列表

  /api/workflow/node-types/{id}/enable:
    post:
      summary: 启用节点类型
      operationId: enableNodeType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 启用成功

  /api/workflow/node-types/{id}/disable:
    post:
      summary: 禁用节点类型
      operationId: disableNodeType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 禁用成功

  # ==================== 变量类型 ====================

  /api/workflow/variable-types:
    get:
      summary: 获取所有变量类型
      operationId: getAllVariableTypes
      responses:
        '200':
          description: 变量类型列表

  /api/workflow/variable-types/categories:
    get:
      summary: 获取变量类型分类列表
      operationId: getVariableTypeCategories
      responses:
        '200':
          description: 分类列表

  /api/workflow/variable-types/category/{category}:
    get:
      summary: 根据分类获取变量类型
      operationId: getVariableTypesByCategory
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 变量类型列表

  # ==================== 工作流执行 ====================

  /api/workflow/{id}/execute:
    post:
      summary: 执行工作流
      operationId: executeWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: triggeredBy
          in: query
          schema:
            type: string
      requestBody:
        description: 输入数据（JSON格式）
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 执行记录ID
          content:
            application/json:
              schema:
                type: integer
                format: int64

  /api/workflow/execution/{id}:
    get:
      summary: 获取执行记录
      operationId: getExecution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 执行记录详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'

  /api/workflow/execution/uuid/{uuid}:
    get:
      summary: 根据UUID获取执行记录
      operationId: getExecutionByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 执行记录详情

  /api/workflow/{workflowId}/executions:
    get:
      summary: 获取工作流执行记录列表
      operationId: getWorkflowExecutions
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 执行记录列表

  /api/workflow/executions/running:
    get:
      summary: 获取正在运行的所有执行
      operationId: getRunningExecutions
      responses:
        '200':
          description: 正在运行的执行列表

  /api/workflow/execution/{id}/abort:
    post:
      summary: 中止执行
      operationId: abortExecution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 中止成功

  /api/workflow/execution/{id}/outputs:
    get:
      summary: 获取执行输出
      description: 获取工作流执行的输出参数和结果
      operationId: getExecutionOutputs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 执行输出

components:
  schemas:
    WorkflowResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        published:
          type: boolean
        hasRun:
          type: boolean
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeDTO'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionDTO'
        associations:
          type: array
          items:
            $ref: '#/components/schemas/AssociationDTO'

    NodeDTO:
      type: object
      description: |
        节点信息。核心节点类型：

        **BASIC 基础节点**：
        - `start`: 开始节点，定义工作流输入参数
        - `end`: 结束节点，定义工作流输出

        **LOGIC 逻辑控制**：
        - `condition_simple`: 简单条件分支（if-else）
        - `condition_multi`: 多路条件分支（switch-case）
        - `loop`: 循环控制（遍历数组）
        - `batch`: 批量并行处理
        - `async`: 异步执行（不阻塞主流程）
        - `collect`: 结果收集（收集多分支结果）

        **EXECUTION 执行节点**：
        - `skill`: 技能执行节点，动态加载 Skill 库中的 Skill
      properties:
        id:
          type: integer
          format: int64
        nodeUuid:
          type: string
          description: 节点UUID（前端生成）
        type:
          type: string
          description: 节点类型编码
        name:
          type: string
          description: 节点名称（用于变量引用，如 `${开始.output}`）
        positionX:
          type: integer
        positionY:
          type: integer
        inputPorts:
          type: string
          description: 输入端口配置（JSON字符串）
        outputPorts:
          type: string
          description: 输出端口配置（JSON字符串）
        inputParams:
          type: string
          description: 输入参数定义（JSON字符串）
        outputParams:
          type: string
          description: 输出参数定义（JSON字符串）
        config:
          type: string
          description: 运行时配置（JSON字符串）
        parentNodeUuid:
          type: string
          nullable: true
          description: 父节点UUID（嵌套节点使用）
        skillId:
          type: string
          description: 关联的 Skill ID（仅 skill 类型节点）
        nodeCategory:
          type: string
          description: 节点分类（BASIC/LOGIC/EXECUTION）

    ConnectionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        connectionUuid:
          type: string
        sourceNodeUuid:
          type: string
        sourcePortId:
          type: string
        targetNodeUuid:
          type: string
        targetPortId:
          type: string
        sourceParamIndex:
          type: integer
          nullable: true
        targetParamIndex:
          type: integer
          nullable: true
        label:
          type: string
          nullable: true

    AssociationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        containerNodeUuid:
          type: string
        bodyNodeUuid:
          type: string
        associationType:
          type: string
          description: |
            关联类型：
            - `LOOP_BODY`: 循环节点与循环体画布的关联

    NodeTypeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: 节点类型编码
        name:
          type: string
        category:
          type: string
          description: 分类（BASIC/LOGIC/EXECUTION）
        description:
          type: string
        icon:
          type: string
        color:
          type: string
        defaultConfig:
          type: string
          description: 默认配置（JSON格式）
        inputPorts:
          type: string
          description: 默认输入端口（JSON格式）
        outputPorts:
          type: string
          description: 默认输出端口（JSON格式）
        sortOrder:
          type: integer
        enabled:
          type: boolean

    WorkflowDataRequest:
      type: object
      description: |
        工作流数据请求（全量覆盖）。

        核心原则：
        1. **全量覆盖**：后端先删除旧数据，再插入新数据
        2. **原子操作**：整个保存在事务中执行
        3. **前端生成UUID**：nodeUuid 和 connectionUuid 由前端生成
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeDTO'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionDTO'
        associations:
          type: array
          items:
            $ref: '#/components/schemas/AssociationDTO'

    ExecutionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
        workflowId:
          type: integer
          format: int64
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED, ABORTED]
        inputData:
          type: string
          description: 输入数据（JSON格式）
        outputData:
          type: string
          description: 输出数据（JSON格式）
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
